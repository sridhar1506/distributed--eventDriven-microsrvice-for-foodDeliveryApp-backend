spring.application.name=auth-service
server.port=${SERVER_PORT}
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}

spring.datasource.url= ${DB_URL}/food_auth_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.threads.virtual.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret-key=${JWT_SECRET_KEY}

management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT}
management.tracing.export.otlp.enabled=true
management.opentelemetry.tracing.export.otlp.timeout=30s

management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT}
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.read-timeout=30s

management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_ENDPOINT}
management.logging.export.otlp.enabled=true
management.opentelemetry.logging.export.otlp.timeout=30s



management.endpoints.web.exposure.include=health,info,prometheus,otlp
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0

# Kafka Configuration (producer only - auth-service only sends userId strings)
spring.kafka.bootstrap-servers=${KAFKA_URL}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

