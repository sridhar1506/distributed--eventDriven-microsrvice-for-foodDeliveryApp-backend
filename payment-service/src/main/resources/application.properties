spring.application.name=payment-service
server.port=${SERVER_PORT}
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}

spring.datasource.url=jdbc:mysql://${DB_URL}/food_payment_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
razorpay.key.id=${RAZORPAY_KEY}
razorpay.key.secret=${RAZORPAY_SECRET}
spring.jpa.hibernate.ddl-auto=update
spring.threads.virtual.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_URL}
spring.kafka.consumer.group-id=payment-group
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.food.payment_service.dto.StockEventDto
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.type.mapping=com.food.restaurant_service.dto.StockEventDto:com.food.payment_service.dto.StockEventDto
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

resilience4j.circuitbreaker.instances.razorpayCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.razorpayCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.razorpayCB.wait-duration-in-open-state=30s

management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT}
management.tracing.export.otlp.enabled=true
management.opentelemetry.tracing.export.otlp.timeout=30s

management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT}
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.read-timeout=30s

management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_ENDPOINT}
management.logging.export.otlp.enabled=true
management.opentelemetry.logging.export.otlp.timeout=30s



management.endpoints.web.exposure.include=health,info,prometheus,otlp
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0